name: Linux
on:
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libobs-dev cmake pkg-config ninja-build xvfb libgl1-mesa-dri python3-tk ffmpeg
      - name: Build OBS plugin
        run: |
          cmake -S obs-plugin -B build-linux/plugin -G Ninja -DCMAKE_BUILD_TYPE=Release -DOBS_JUKEBOX_QA=ON
          cmake --build build-linux/plugin --parallel 2
      - name: Check installer Geode compatibility
        run: |
          python3 tools/qa/check-geode-version.py
          python3 tools/qa/unix-install-state.py --perl /usr/bin/perl
      - name: Check graphical installer
        run: xvfb-run -a python3 tools/qa/linux-installer-ui.py
      - name: Check installer rollback
        run: python3 tools/qa/linux-installer-transaction.py
      - name: Check link diagnostics
        run: python3 tools/qa/test_link_protocol.py
      - name: Check timestamped playback
        run: bash scripts/tests/audio/run.sh
      - name: Check Proton paths and audio clock
        run: |
          c++ -std=c++20 -O2 tools/qa/linux-paths-check.cpp -o build-linux/linux-paths-check
          build-linux/linux-paths-check .
      - name: Build OBS runtime checks
        run: |
          cmake -S tools/qa -B build-linux/qa -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux/qa --parallel 2
          ctest --test-dir build-linux/qa --output-on-failure
      - name: Check OBS audio
        env:
          OBS_JUKEBOX_TEST_PORT: '39023'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a build-linux/qa/obs-runtime-validation "$PWD/build-linux/plugin/separate-song.so" "$PWD/artifacts/linux-qa"
      - name: Stage Linux files
        run: |
          cmake -S obs-plugin -B build-linux/production -G Ninja -DCMAKE_BUILD_TYPE=Release -DOBS_JUKEBOX_QA=OFF
          cmake --build build-linux/production --parallel 2
          mkdir -p artifacts/linux-native/payload
          install -m 755 build-linux/production/separate-song.so artifacts/linux-native/payload/separate-song.so
          install -m 755 scripts/install-linux.sh artifacts/linux-native/Install.sh
          install -m 644 scripts/install-state.pl artifacts/linux-native/install-state.pl
          install -m 644 scripts/check-geode-version.pl artifacts/linux-native/check-geode-version.pl
          install -m 755 installer/linux/OBS-Jukebox-Setup artifacts/linux-native/OBS-Jukebox-Setup
          install -m 644 installer/linux/installer.py artifacts/linux-native/installer.py
          install -m 644 logo.png artifacts/linux-native/logo.png
          ldd build-linux/production/separate-song.so > artifacts/linux-native/dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OBS-Jukebox-Linux-native-x86_64
          path: artifacts/linux-native
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Linux-audio-checks
          path: artifacts/linux-qa
          if-no-files-found: ignore
